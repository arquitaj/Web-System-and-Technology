<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Your Company</title>
    <link rel="stylesheet" href="styles/contactform_styles.css"> </head>
<body>

    <button id="openContactForm" class="trigger-btn">
        Contact Us
    </button>

    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>

            <h1>Contact Me</h1>
            <p>I would love to hear from you! Please fill out the form below and I'll get back to you as soon as possible.</p>
            
            <form action="#" method="POST" class="contact-form">
                  
                <div class="form-group">
                    <label for="name">Name <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="Your Full Name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com">
                </div>

                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="09171234567">
                </div>

                <div class="form-group">
                    <label for="subject">Subject <span class="required">*</span></label>
                    <input type="text" id="subject" name="subject" required placeholder="E.g., Support Inquiry, Partnership Request">
                </div>

                <div class="form-group">
                    <label for="message">Message <span class="required">*</span></label>
                    <textarea id="message" name="message" rows="6" required placeholder="Tell us what you're thinking..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>

            <div id="confirmationMessage" class="confirmation-message" style="display: none;">
              <h2>Thank You! 🎉</h2>
              <p>Your message has been successfully sent. I appreciate you reaching out and will get back to you the soonest available time.</p>
            </div>
        </div>
    </div>

    <script src="script/script.js"></script> </body>
</body>
</html>
